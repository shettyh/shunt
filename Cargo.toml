[workspace]
resolver = "2"
members = [
    "crates/shunt-plugin-sdk",
    "crates/shunt-core",
    "crates/shunt-plugins",
    "crates/shunt-ai",
    "crates/shunt-config",
    "crates/shunt-cli",
    "benches/shunt-bench",
]

[workspace.package]
version = "0.0.1" # x-release-please-version
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/shunt-rs/shunt"

[workspace.dependencies]
shunt-plugin-sdk = { version = "0.0.1", path = "crates/shunt-plugin-sdk" } # x-release-please-version
shunt-core = { version = "0.0.1", path = "crates/shunt-core" } # x-release-please-version
shunt-plugins = { version = "0.0.1", path = "crates/shunt-plugins" } # x-release-please-version
shunt-ai = { version = "0.0.1", path = "crates/shunt-ai" } # x-release-please-version
shunt-config = { version = "0.0.1", path = "crates/shunt-config" } # x-release-please-version

arc-swap = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "client-legacy", "http1", "http2"] }
notify = "8"
pin-project-lite = "0.2"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "0.8"
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
webpki-roots = "0.26"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
