[workspace]
resolver = "2"
members = [
    "crates/shunt-plugin-sdk",
    "crates/shunt-engine",
    "crates/shunt-plugins",
    "crates/shunt-ai",
    "crates/shunt-mcp",
    "crates/shunt-config",
    "crates/shunt-test",
    "crates/shunt-cli",
    "benches/shunt-bench",
]

[workspace.package]
version = "0.4.0" # x-release-please-version
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/shettyh/shunt"

[workspace.dependencies]
shunt-plugin-sdk = { version = "0.4.0", path = "crates/shunt-plugin-sdk" } # x-release-please-version
shunt-engine = { version = "0.4.0", path = "crates/shunt-engine" } # x-release-please-version
shunt-plugins = { version = "0.4.0", path = "crates/shunt-plugins" } # x-release-please-version
shunt-ai = { version = "0.4.0", path = "crates/shunt-ai" } # x-release-please-version
shunt-mcp = { version = "0.4.0", path = "crates/shunt-mcp" } # x-release-please-version
shunt-config = { version = "0.4.0", path = "crates/shunt-config" } # x-release-please-version
shunt-test = { version = "0.4.0", path = "crates/shunt-test" } # x-release-please-version

arc-swap = "1"
brotli = "9"
bytes = "1"
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "client-legacy", "http1", "http2"] }
notify = "9"
pin-project-lite = "0.2"
proptest = "1"
rcgen = "0.14"
regex = "1"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "1.2"
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
webpki-roots = "1.0"
zstd = { version = "0.14", default-features = false }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)", "cfg(loom)"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
