[package]
name = "shunt-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Canonical IR, shunt.toml loader/watcher, SnapshotCompiler, and Admin API for Shunt"

[features]
default = ["admin-ui"]
admin-ui = []

[dependencies]
shunt-plugin-sdk.workspace = true
shunt-core.workspace = true

arc-swap.workspace = true
bytes.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
# Path-only dev-dep breaks the cyclic dev-dependency with `shunt-plugins` on `cargo publish`.
shunt-plugins = { path = "../shunt-plugins" }
rcgen.workspace = true

[lints]
workspace = true
