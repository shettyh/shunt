# Shunt Kubernetes Gateway API v1 Example (RFC 0018)
# Validate locally:  shunt check --k8s-manifest examples/k8s-gateway-api.yaml
# Verify statically: shunt verify --k8s-manifest examples/k8s-gateway-api.yaml
# Run locally:       shunt dev --k8s-manifest examples/k8s-gateway-api.yaml

apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: shunt
spec:
  controllerName: shunt.io/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge-gateway
  namespace: default
  annotations:
    shunt.io/global-plugins: '[{"name":"request-id"},{"name":"metrics"}]'
spec:
  gatewayClassName: shunt
  listeners:
    - name: http
      hostname: "*.example.com"
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: v1
kind: Service
metadata:
  name: payments-v1
  namespace: default
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Endpoints
metadata:
  name: payments-v1
  namespace: default
subsets:
  - addresses:
      - ip: 127.0.0.1
    ports:
      - name: http
        port: 18080
---
apiVersion: v1
kind: Service
metadata:
  name: payments-v2
  namespace: default
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Endpoints
metadata:
  name: payments-v2
  namespace: default
subsets:
  - addresses:
      - ip: 127.0.0.1
    ports:
      - name: http
        port: 18081
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: payments-route
  namespace: default
  annotations:
    shunt.io/max-attempts: "2"
    shunt.io/max-body-bytes: "1048576"
    shunt.io/plugins: '[{"name":"compression","config":{"encodings":["zstd","br","gzip"],"min_size_bytes":1024}}]'
spec:
  parentRefs:
    - name: edge-gateway
  hostnames:
    - "api.example.com"
  rules:
    - matches:
        - path:
            type: Exact
            value: /v1/payments/legacy
      filters:
        - type: RequestRedirect
          requestRedirect:
            statusCode: 301
            scheme: https
            path:
              type: ReplaceFullPath
              replaceFullPath: /v2/payments
    - matches:
        - path:
            type: PathPrefix
            value: /v2/payments
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-gateway
                value: shunt-k8s
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - name: x-powered-by
                value: shunt
        - type: RequestMirror
          requestMirror:
            backendRef:
              name: payments-v2
              port: 80
      timeouts:
        backendRequest: 10s
      backendRefs:
        - name: payments-v1
          port: 80
          weight: 90
        - name: payments-v2
          port: 80
          weight: 10
