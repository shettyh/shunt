# Shunt Modern HTTP API Gateway Example (RFC 0018)
# Demonstrates JWT/JWKS auth, CIDR IP filtering, request body size limits,
# streaming-safe response compression (zstd/br/gzip), header-based routing,
# and HTTP redirects.

[server]
listen = "127.0.0.1:8080"
drain_timeout_ms = 10000

# Optional mTLS listener configuration:
# [server.tls]
# cert = "certs/server.crt"
# key = "certs/server.key"
# client_ca = "certs/client-ca.crt"
# client_auth = "optional" # "none" | "optional" | "required"

[admin]
enabled = true
listen = "127.0.0.1:9090"

[[plugins]]
name = "request-id"

[[plugins]]
name = "metrics"

[[upstreams]]
name = "api_backend"
endpoints = [
  { url = "http://127.0.0.1:18080", weight = 90 },
  { url = "http://127.0.0.1:18081", weight = 10 },
]

[upstreams.health_check]
kind = "http"
path = "/health"
interval_ms = 5000
timeout_ms = 1000

[[routes]]
id = "legacy_redirect"
path_prefix = "/legacy"
upstream = "api_backend"

[[routes.plugins]]
name = "redirect"
[routes.plugins.config]
status_code = 301
scheme = "https"
hostname = "api.example.com"
path_match_prefix = "/legacy"
path_replace_prefix = "/v2"

[[routes]]
id = "api_v2_canary_header"
path_prefix = "/v2"
headers = { "x-release-track" = "canary" }
upstream = "api_backend"

[[routes.plugins]]
name = "header-rewrite"
[routes.plugins.config]
response_set = { "x-track" = "canary" }

[[routes]]
id = "api_v2"
path_prefix = "/v2"
upstream = "api_backend"

[[routes.plugins]]
name = "ip-filter"
[routes.plugins.config]
allow = ["127.0.0.0/8", "10.0.0.0/8", "::1/128"]
deny = ["10.99.0.0/16"]
trusted_proxies = ["127.0.0.1/32"]
use_forwarded_for = true

[[routes.plugins]]
name = "jwt-auth"
[routes.plugins.config]
# Replace with `jwks_uri` or `oidc_discovery = true` in production:
# jwks_uri = "https://auth.example.com/.well-known/jwks.json"
algorithms = ["HS256"]
keys = [{ kid = "demo-hs1", secret = "env:SHUNT_JWT_SECRET" }]
issuer = "https://auth.example.com"
audience = "shunt-api"
required_scopes = ["read"]
forward_claims = { "sub" = "x-user-id", "org.id" = "x-org-id" }
strip_header = true

[[routes.plugins]]
name = "body-limit"
[routes.plugins.config]
max_bytes = 1048576 # 1 MiB (enforced on both Content-Length and chunked streams)

[[routes.plugins]]
name = "compression"
[routes.plugins.config]
encodings = ["zstd", "br", "gzip"]
min_size_bytes = 1024
level = 4
