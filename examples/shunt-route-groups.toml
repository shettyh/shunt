# Shunt Route Groups & Shared Plugin Chains Example (RFC 0021)
#
# Demonstrates organizing multiple API routes under reusable [[route_groups]]
# with inherited match defaults (hosts, path_prefix, methods), shared timeout
# policies, and shared plugin instances (one JWT JWKS cache and one shared
# rate-limit bucket across all routes in a group).
#
# Usage:
#   shunt check -c examples/shunt-route-groups.toml
#   shunt verify -c examples/shunt-route-groups.toml

[server]
listen = "127.0.0.1:8080"
drain_timeout_ms = 10000

[admin]
enabled = true
listen = "127.0.0.1:9090"

[[plugins]]
name = "request-id"

[[plugins]]
name = "metrics"

[[upstreams]]
name = "users_svc"
endpoints = ["http://127.0.0.1:18081"]

[[upstreams]]
name = "orders_svc"
endpoints = ["http://127.0.0.1:18082"]

[[upstreams]]
name = "public_svc"
endpoints = ["http://127.0.0.1:18083"]

# Group 1: Authenticated v2 API with shared CIDR filter, JWT verifier, and shared rate limit.
[[route_groups]]
id = "api_v2"
hosts = ["*.example.com"]
path_prefix = "/v2"
strip_prefix = "/v2"
max_body_bytes = 1048576
max_attempts = 2
response_headers_timeout_ms = 10000
idle_chunk_timeout_ms = 30000
allow_websockets = false

[[route_groups.plugins]]
name = "ip-filter"
[route_groups.plugins.config]
allow = ["127.0.0.0/8", "10.0.0.0/8", "::1/128"]

[[route_groups.plugins]]
name = "jwt-auth"
id = "api-v2-jwt"
[route_groups.plugins.config]
algorithms = ["HS256"]
keys = [{ kid = "demo-hs1", secret = "env:SHUNT_JWT_SECRET" }]
issuer = "https://auth.example.com"
audience = "shunt-api"

[[route_groups.plugins]]
name = "rate-limit"
id = "api-v2-shared-rl"
[route_groups.plugins.config]
requests_per_second = 100.0
burst = 200
key = "client_ip"

# Routes stay in a single top-to-bottom ordered list (explicit first-match-wins precedence).
[[routes]]
id = "api_v2_users"
group = "api_v2"
hosts = ["api.example.com"]
path_prefix = "/users"          # lowered to "/v2/users"
methods = ["GET", "POST"]
upstream = "users_svc"

[[routes]]
id = "api_v2_orders"
group = "api_v2"
path_prefix = "/orders"         # lowered to "/v2/orders"
upstream = "orders_svc"
max_attempts = 3                # overrides group default (2)

[[routes.plugins]]
name = "header-rewrite"         # runs after global + group plugins
[routes.plugins.config]
response_set = { "x-service" = "orders" }

# Ungrouped public health endpoint (no auth, no group rate limit).
[[routes]]
id = "public_health"
path_exact = "/health"
methods = ["GET"]
upstream = "public_svc"

# Declarative CI verification policy targeting the route group directly.
[verify]
[[verify.route_policies]]
match_group = "api_*"
require_plugins = ["jwt-auth", "rate-limit"]
