# Shunt AI Gateway — Guardrails, Redacted Audit Sinks & Alert Webhooks (RFC 0015)
#
# Demonstrates:
# - Inline PII & secret redaction (`ai-guardrails`) on requests, responses, and SSE streams
# - Prompt injection & custom regex/keyword/policy blocking
# - External guardrail callouts (OPA / Presidio / Lakera / Bedrock Guardrails / Llama Guard)
# - Redacted prompt/completion audit sinks (`ai-audit`: JSONL + OTLP GenAI events + signed webhook)
# - Deduplicated Slack, PagerDuty & signed HTTP operational alerts (`ai-alerts`)
#
# Validate with:
#   shunt check  -c examples/shunt-ai-guardrails-audit-alerts.toml
#   shunt verify -c examples/shunt-ai-guardrails-audit-alerts.toml

[server]
listen = "127.0.0.1:8080"

[admin]
enabled = true
listen = "127.0.0.1:9090"

[telemetry]
enabled = true
endpoint = "http://127.0.0.1:4318/v1/traces"
service_name = "shunt-ai-guarded"

[[upstreams]]
name = "openai"
endpoints = ["https://api.openai.com"]

[[upstreams]]
name = "anthropic"
endpoints = ["https://api.anthropic.com"]

[[routes]]
id = "ai-guarded"
path_prefix = "/v1/"
upstream = "openai"
max_attempts = 2
max_body_bytes = 2097152

[[routes.plugins]]
name = "otel-trace"
[routes.plugins.config]
sample_rate = 1.0

[[routes.plugins]]
name = "ai-model-router"
[routes.plugins.config.models]
smart = [
  { provider = "openai", upstream = "openai", model = "gpt-4o" },
  { provider = "anthropic", upstream = "anthropic", model = "claude-sonnet-4-20250514" },
]

[[routes.plugins]]
name = "ai-provider-adapter"
[routes.plugins.config.providers.openai]
preset = "openai"
[routes.plugins.config.providers.openai.auth]
type = "bearer"
api_key = "env:OPENAI_API_KEY"

[routes.plugins.config.providers.anthropic]
preset = "anthropic"
[routes.plugins.config.providers.anthropic.auth]
type = "header"
header = "x-api-key"
api_key = "env:ANTHROPIC_API_KEY"

[[routes.plugins]]
name = "ai-guardrails"
[routes.plugins.config]
presets = ["pii", "secrets", "prompt_injection"]
direction = "both"
action = "redact"
redaction_mode = "mask"
on_stream_violation = "redact_and_stop"
stream_holdback_chars = 64

[routes.plugins.config.policy]
max_prompt_chars = 65536
max_messages = 64
blocked_roles = ["developer"]

[[routes.plugins.config.regex_rules]]
name = "internal_ticket"
pattern = "ACME-[0-9]{4,8}"
direction = "both"
action = "redact"
replacement = "[REDACTED:TICKET]"

[[routes.plugins.config.keyword_rules]]
name = "confidential_codenames"
keywords = ["project_obsidian", "internal_merger"]
direction = "request"
action = "block"
message = "Confidential project codename is not permitted in external prompts"

# Optional external guardrail callout (e.g., OPA, Presidio, Lakera, Bedrock Guardrails, Llama Guard):
# [[routes.plugins.config.external]]
# name = "lakera_guard"
# kind = "lakera"
# api_key = "env:LAKERA_API_KEY"
# stages = ["pre_request", "post_response"]
# action = "block"
# timeout_ms = 1500
# fail_open = false

[[routes.plugins]]
name = "ai-budget"
[routes.plugins.config]
scope = "global"
default_limit_usd = 50.0
soft_warning_ratio = 0.8
window = "daily"

[[routes.plugins]]
name = "ai-failover"
[routes.plugins.config]
retry_statuses = [429, 500, 502, 503, 504, 529]
cooldown_ms = 30000
failure_threshold = 2
respect_retry_after = true

[[routes.plugins]]
name = "ai-usage-tracker"

[[routes.plugins]]
name = "ai-audit"
[routes.plugins.config]
include_prompt = true
include_completion = true
redact_pii = true
redact_secrets = true
max_capture_bytes = 32768
sample_rate = 1.0
include_headers = ["x-request-id", "x-tenant-id"]

[routes.plugins.config.jsonl]
path = "./logs/shunt-ai-audit.jsonl"
max_file_bytes = 104857600

[routes.plugins.config.otlp_events]
enabled = true

# Optional signed async SIEM webhook sink:
# [routes.plugins.config.webhook]
# url = "https://siem.internal/v1/ai-audit"
# signing_secret = "env:AUDIT_WEBHOOK_SECRET"
# batch_size = 16
# flush_interval_ms = 2000

[[routes.plugins]]
name = "ai-alerts"
[routes.plugins.config]
dedup_window_ms = 60000
events = [
  "budget_soft_warning",
  "budget_hard_exceeded",
  "circuit_breaker_open",
  "failover_exhausted",
  "guardrail_block",
]

[[routes.plugins.config.targets]]
type = "http"
name = "ops_webhook"
url = "http://127.0.0.1:9999/alerts"
# signing_secret = "env:ALERT_WEBHOOK_SECRET"

