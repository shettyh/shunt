# Example Shunt AI Gateway configuration (`shunt-ai` plugin pack)
#
# Usage:
#   export OPENAI_API_KEY="sk-..."
#   export ANTHROPIC_API_KEY="sk-ant-..."
#   shunt check -c examples/shunt-ai.toml
#   shunt dev   -c examples/shunt-ai.toml
#
# Unified OpenAI-compatible frontend:
#   curl http://127.0.0.1:8080/v1/chat/completions \
#     -H "Content-Type: application/json" \
#     -d '{"model":"smart","stream":true,"messages":[{"role":"user","content":"Hello!"}]}'

[server]
listen = "127.0.0.1:8080"
drain_timeout_ms = 30000

[admin]
enabled = true
listen = "127.0.0.1:9090"

[[plugins]]
name = "request-id"

[[plugins]]
name = "metrics"

[[plugins]]
name = "access-log"

[[upstreams]]
name = "openai"
endpoints = ["https://api.openai.com"]
connect_timeout_ms = 5000

[[upstreams]]
name = "anthropic"
endpoints = ["https://api.anthropic.com"]
connect_timeout_ms = 5000

[[routes]]
id = "ai_chat_completions"
path_exact = "/v1/chat/completions"
methods = ["POST"]
upstream = "openai"
max_attempts = 2
response_headers_timeout_ms = 60000
idle_chunk_timeout_ms = 30000

# 1. Buffer request JSON, parse `model` + `stream`, and select ordered fallback targets.
[[routes.plugins]]
name = "ai-model-router"
[routes.plugins.config]
max_body_bytes = 2097152
auto_max_attempts = true

[routes.plugins.config.models]
smart = [
    { provider = "openai", upstream = "openai", model = "gpt-4o" },
    { provider = "anthropic", upstream = "anthropic", model = "claude-3-5-sonnet-20241022" },
]
fast = [
    { provider = "openai", upstream = "openai", model = "gpt-4o-mini" },
    { provider = "anthropic", upstream = "anthropic", model = "claude-3-5-haiku-20241022" },
]

[[routes.plugins.config.rules]]
pattern = "claude-*"
targets = [
    { provider = "anthropic", upstream = "anthropic" },
]

[[routes.plugins.config.rules]]
pattern = "gpt-*"
targets = [
    { provider = "openai", upstream = "openai" },
]

# 2. Inject provider-specific auth/paths and translate OpenAI <-> Anthropic JSON & live SSE.
[[routes.plugins]]
name = "ai-provider-adapter"
[routes.plugins.config]
response_headers = true

[routes.plugins.config.openai]
api_key = "env:OPENAI_API_KEY"
include_stream_usage = true

[routes.plugins.config.anthropic]
api_key = "env:ANTHROPIC_API_KEY"
anthropic_version = "2023-06-01"
default_max_tokens = 4096

# 3. Fail over automatically on 429 / 5xx / 529 across the configured provider chain.
[[routes.plugins]]
name = "ai-failover"
id = "ai-chat-failover"
[routes.plugins.config]
retry_statuses = [429, 500, 502, 503, 504, 529]
cooldown_ms = 15000
failure_threshold = 2
respect_retry_after = true

# 4. Track prompt/completion tokens, TTFT, and emit Prometheus metrics + structured logs.
[[routes.plugins]]
name = "ai-usage-tracker"
[routes.plugins.config]
log_usage = true
