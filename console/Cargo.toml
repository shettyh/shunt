[workspace]
resolver = "2"
members = [
    "crates/shunt-console-core",
    "crates/shunt-console-api",
    "crates/shunt-console-bin",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/shettyh/shunt"

[workspace.dependencies]
# Path dependencies on core Shunt data-plane crates (strictly one-way: console -> core).
shunt-plugin-sdk = { path = "../crates/shunt-plugin-sdk" }
shunt-engine = { path = "../crates/shunt-engine" }
shunt-plugins = { path = "../crates/shunt-plugins" }
shunt-ai = { path = "../crates/shunt-ai" }
shunt-mcp = { path = "../crates/shunt-mcp" }
shunt-config = { path = "../crates/shunt-config" }

# Internal console crates.
shunt-console-core = { path = "crates/shunt-console-core" }
shunt-console-api = { path = "crates/shunt-console-api" }

# Control-plane dependencies (never pulled into root shunt workspace).
argon2 = "0.5"
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
mime_guess = "2"
proptest = "1"
ring = "0.17"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "sqlite", "postgres", "migrate", "macros", "chrono", "json"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "1.2"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "limit", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ulid = "1"
utoipa = { version = "5", features = ["axum_extras", "chrono"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
