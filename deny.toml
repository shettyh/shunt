# Configuration for cargo-deny (https://embarkstudios.github.io/cargo-deny/)

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # serde_yaml 0.9 is used in shunt-config for optional .yaml/.yml config parsing.
    # Tracked for migration to a maintained YAML parser.
    "RUSTSEC-2024-0320",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
