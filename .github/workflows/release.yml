name: Release

# Normal merges to `main` open/update a Release Please PR based on conventional
# commits. Merging that PR creates a draft GitHub Release + tag, builds all
# cross-platform binaries and the multi-arch GHCR Docker image, publishes the
# GitHub Release once all builds succeed, updates `shettyh/homebrew-tap`, and
# publishes workspace crates to crates.io in dependency order.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build all 7 release binaries from this ref without publishing"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  release_please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      should_build: ${{ steps.meta.outputs.should_build }}
      should_publish: ${{ steps.meta.outputs.should_publish }}
    steps:
      - name: Run Release Please
        if: github.event_name == 'push'
        id: release
        uses: googleapis/release-please-action@v5

      # Pull requests opened or updated with GITHUB_TOKEN do not emit another
      # pull_request event. Dispatch required checks explicitly so the Release
      # PR gets checked without requiring a personal access token.
      - name: Run checks for Release PR
        if: github.event_name == 'push' && steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          branch=$(printf '%s' "$RELEASE_PR" | jq -r '.headBranchName')
          test -n "$branch" && test "$branch" != "null"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          gh workflow run security.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

      - name: Checkout for manual dry-run metadata
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: Resolve release metadata
        id: meta
        env:
          RELEASE_CREATED: ${{ steps.release.outputs.release_created || 'false' }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name || '' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python3 - <<'PY'
          import os, tomllib

          event_name = os.environ["GITHUB_EVENT_NAME"]
          release_created = os.environ.get("RELEASE_CREATED", "false") == "true"

          if event_name == "push":
              if release_created:
                  tag_name = os.environ["RELEASE_TAG"]
                  version = tag_name.removeprefix("v")
                  checkout_ref = tag_name
                  should_build = "true"
                  should_publish = "true"
              else:
                  tag_name = ""
                  version = ""
                  checkout_ref = ""
                  should_build = "false"
                  should_publish = "false"
          else:
              with open("Cargo.toml", "rb") as f:
                  version = tomllib.load(f)["workspace"]["package"]["version"]
              tag_name = f"v{version}"
              checkout_ref = os.environ["GITHUB_SHA"]
              should_build = "true"
              dry_run = os.environ.get("DRY_RUN", "true").lower() == "true"
              should_publish = "false" if dry_run else "true"

          is_prerelease = "true" if "-" in version else "false"

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={version}\n")
              out.write(f"tag_name={tag_name}\n")
              out.write(f"checkout_ref={checkout_ref}\n")
              out.write(f"is_prerelease={is_prerelease}\n")
              out.write(f"should_build={should_build}\n")
              out.write(f"should_publish={should_publish}\n")

          print(f"Release meta: version={version}, tag={tag_name}, build={should_build}, publish={should_publish}")
          PY

  build-binaries:
    name: Build (${{ matrix.target }})
    needs: release_please
    if: needs.release_please.outputs.should_build == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
            archive: tar.gz
            ext: ""
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            archive: tar.gz
            ext: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
            archive: tar.gz
            ext: ""
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            archive: tar.gz
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
            archive: tar.gz
            ext: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
            archive: tar.gz
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
            archive: zip
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release_please.outputs.checkout_ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup cross-compilation toolchain
        if: matrix.cross
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p shunt-cli --bin shunt

      - name: Package archive (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          pkg="shunt-${{ needs.release_please.outputs.tag_name }}-${{ matrix.target }}"
          mkdir -p "dist/${pkg}/examples"
          cp "target/${{ matrix.target }}/release/shunt" "dist/${pkg}/shunt"
          cp LICENSE "dist/${pkg}/LICENSE"
          cp examples/shunt.toml examples/shunt-ai.toml "dist/${pkg}/examples/"
          tar -czf "dist/${pkg}.tar.gz" -C dist "${pkg}"
          rm -rf "dist/${pkg}"

      - name: Package archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $pkg = "shunt-${{ needs.release_please.outputs.tag_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$pkg/examples" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/shunt.exe" "dist/$pkg/shunt.exe"
          Copy-Item "LICENSE" "dist/$pkg/LICENSE"
          Copy-Item "examples/shunt.toml", "examples/shunt-ai.toml" "dist/$pkg/examples/"
          Compress-Archive -Path "dist/$pkg" -DestinationPath "dist/$pkg.zip" -Force
          Remove-Item -Recurse -Force "dist/$pkg"

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/shunt-*
          if-no-files-found: error

  docker-publish:
    name: Publish Docker Image (GHCR)
    needs: [release_please, build-binaries]
    if: needs.release_please.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release_please.outputs.checkout_ref }}

      - name: Download prebuilt Linux musl binaries
        uses: actions/download-artifact@v8
        with:
          pattern: release-*-unknown-linux-musl
          path: dist

      - name: Stage multi-arch binaries for Docker build
        env:
          TAG_NAME: ${{ needs.release_please.outputs.tag_name }}
        run: |
          mkdir -p docker-bin/linux/amd64 docker-bin/linux/arm64
          tar -xzf "dist/release-x86_64-unknown-linux-musl/shunt-${TAG_NAME}-x86_64-unknown-linux-musl.tar.gz" \
            --strip-components=1 -C docker-bin/linux/amd64 "shunt-${TAG_NAME}-x86_64-unknown-linux-musl/shunt"
          tar -xzf "dist/release-aarch64-unknown-linux-musl/shunt-${TAG_NAME}-aarch64-unknown-linux-musl.tar.gz" \
            --strip-components=1 -C docker-bin/linux/arm64 "shunt-${TAG_NAME}-aarch64-unknown-linux-musl/shunt"
          chmod +x docker-bin/linux/amd64/shunt docker-bin/linux/arm64/shunt
          ls -lh docker-bin/linux/*/shunt

      - name: Set lowercased image name
        id: img
        run: |
          repo="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.img.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release_please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release_please.outputs.tag_name }}
            type=semver,pattern={{major}},value=${{ needs.release_please.outputs.tag_name }}
            type=raw,value=latest,enable=${{ needs.release_please.outputs.is_prerelease != 'true' }}
            type=sha

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Attest container image provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.img.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish-release:
    name: Publish GitHub Release
    needs: [release_please, build-binaries, docker-publish]
    if: needs.release_please.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: |
          sha256sum shunt-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Upload assets and publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release_please.outputs.tag_name }}
          IS_PRERELEASE: ${{ needs.release_please.outputs.is_prerelease }}
        run: |
          gh release upload "$TAG_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --title "Shunt $TAG_NAME" --draft=false --prerelease
          else
            gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --title "Shunt $TAG_NAME" --draft=false --latest
          fi

  update-homebrew:
    name: Update Homebrew Tap
    needs: [release_please, publish-release]
    if: needs.release_please.outputs.should_publish == 'true' && needs.release_please.outputs.is_prerelease != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check Homebrew tap token
        id: tap_auth
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            echo "::warning::HOMEBREW_TAP_TOKEN secret is not set; skipping automatic shettyh/homebrew-tap Formula update."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.tap_auth.outputs.enabled == 'true'
        with:
          ref: ${{ needs.release_please.outputs.checkout_ref }}

      - name: Checkout shettyh/homebrew-tap
        if: steps.tap_auth.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          repository: shettyh/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Formula/shunt.rb
        if: steps.tap_auth.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release_please.outputs.tag_name }}
        run: |
          set -euo pipefail
          sums_dir="$RUNNER_TEMP/shunt-checksums"
          mkdir -p "$sums_dir"
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS.txt -D "$sums_dir"

          python3 scripts/render-homebrew-formula.py \
            --tag "$TAG_NAME" \
            --checksums "$sums_dir/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --output homebrew-tap/Formula/shunt.rb

          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/shunt.rb
          if git diff --cached --quiet; then
            echo "Formula/shunt.rb is already up to date."
          else
            git commit -m "Update shunt formula to ${TAG_NAME}"
            git push
          fi

  crates-publish:
    name: Publish to crates.io
    needs: [release_please, publish-release]
    if: needs.release_please.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release_please.outputs.checkout_ref }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Publish workspace crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_VERSION: ${{ needs.release_please.outputs.version }}
        run: |
          if [[ -z "${CARGO_REGISTRY_TOKEN}" ]]; then
            echo "error: CARGO_REGISTRY_TOKEN secret is not configured in the 'crates-io' environment." >&2
            exit 1
          fi

          # Topological order respecting both normal and dev dependencies:
          CRATES=(
            shunt-plugin-sdk
            shunt-engine
            shunt-plugins
            shunt-config
            shunt-ai
            shunt-mcp
            shunt-test
            shunt-cli
          )

          index_url() {
            local name="$1"
            local lower="${name,,}"
            local p1="${lower:0:2}"
            local p2="${lower:2:2}"
            echo "https://index.crates.io/${p1}/${p2}/${lower}"
          }

          is_published() {
            local name="$1"
            local ver="$2"
            local url
            url="$(index_url "$name")"
            curl -fsSL "$url" 2>/dev/null | grep -q "\"vers\":\"${ver}\""
          }

          wait_for_index() {
            local name="$1"
            local ver="$2"
            echo "==> Waiting for ${name} ${ver} to appear in crates.io index..."
            for _ in $(seq 1 36); do
              if is_published "$name" "$ver"; then
                echo "    ${name} ${ver} is visible on crates.io."
                return 0
              fi
              sleep 5
            done
            echo "warning: timed out waiting for ${name} ${ver} on sparse index; continuing..." >&2
          }

          for crate in "${CRATES[@]}"; do
            if is_published "$crate" "$RELEASE_VERSION"; then
              echo "==> Skipping ${crate} ${RELEASE_VERSION} (already published)"
              continue
            fi
            echo "==> Publishing ${crate} ${RELEASE_VERSION}..."
            cargo publish --locked -p "$crate"
            wait_for_index "$crate" "$RELEASE_VERSION"
          done
