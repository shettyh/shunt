name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  doc:
    name: Rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Run unit and integration tests
        run: cargo nextest run --workspace --locked --no-fail-fast
      - name: Run doctests
        run: cargo test --workspace --doc --locked

  smoke:
    name: CLI & Config Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build shunt CLI
        run: cargo build --locked -p shunt-cli --bin shunt
      - name: Verify CLI flags and validate example & bench configs
        env:
          OPENAI_API_KEY: ci-dummy-openai-key
          ANTHROPIC_API_KEY: ci-dummy-anthropic-key
        run: |
          ./target/debug/shunt --version
          ./target/debug/shunt --help
          for cfg in examples/shunt.toml examples/shunt-ai.toml benches/configs/shunt-*.toml; do
            echo "==> Checking $cfg"
            ./target/debug/shunt check -c "$cfg"
          done

  msrv:
    name: MSRV (1.91)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci:
    name: CI
    if: always()
    needs: [fmt, clippy, doc, test, smoke, msrv, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Check all required jobs succeeded
        env:
          JOB_RESULTS: ${{ toJson(needs.*.result) }}
        run: |
          echo "Job results: $JOB_RESULTS"
          echo "$JOB_RESULTS" | jq -e 'all(. == "success")'
