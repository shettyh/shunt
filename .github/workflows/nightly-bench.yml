name: Nightly Benchmarks

on:
  schedule:
    # Daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      suites:
        description: "Benchmark suites to run (all, api, ai, mcp, soak, or comma-separated)"
        type: string
        default: "all"
      duration_secs:
        description: "HTTP benchmark duration in seconds"
        type: string
        default: "5"
      http_concurrency:
        description: "HTTP benchmark concurrency"
        type: string
        default: "64"
      sse_concurrency:
        description: "Concurrent SSE streams"
        type: string
        default: "500"
      open_pr:
        description: "Open or update a PR with the generated benchmark report"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  benchmark:
    name: Nightly Shunt Benchmarks (API, AI, MCP & Soak)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-bench

      - name: Run unified Shunt benchmark suite and generate Markdown report
        env:
          DURATION_SECS: ${{ inputs.duration_secs || '5' }}
          WARMUP_SECS: "2"
          HTTP_CONCURRENCY: ${{ inputs.http_concurrency || '64' }}
          SSE_CONCURRENCY: ${{ inputs.sse_concurrency || '500' }}
          SSE_MED_CONCURRENCY: "200"
          SSE_CHUNKS: "20"
          SSE_INTERVAL_MS: "25"
        run: |
          chmod +x benches/scripts/bench.sh benches/scripts/render_report.py
          ./benches/scripts/bench.sh \
            --suite "${{ inputs.suites || 'all' }}" \
            --profile ci \
            --competitors none \
            --title "Shunt Nightly Benchmark Report" \
            --output-md benches/results/nightly.md
          cat benches/results/nightly.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark report artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-benchmark-report
          path: benches/results/nightly.md

      - name: Open or update benchmark report PR
        if: ${{ github.event_name == 'schedule' || inputs.open_pr == true }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bench/nightly-report
          delete-branch: true
          add-paths: benches/results/nightly.md
          commit-message: "perf(bench): update nightly benchmark report"
          title: "perf(bench): update nightly benchmark report"
          body: |
            Automated benchmark report generated by the **Nightly Benchmarks** workflow (RFC 0020 unified API / AI / MCP / Soak suite).

            - **Commit:** `${{ github.sha }}`
            - **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - **Report:** [`benches/results/nightly.md`](benches/results/nightly.md)
