# API Workload: 200-route table + 3-endpoint weighted upstream pool + active HTTP health probes
[server]
listen = "127.0.0.1:18081"
drain_timeout_ms = 5000

[admin]
enabled = false

[[upstreams]]
name = "lb_pool"
endpoints = [
  { url = "http://127.0.0.1:18080", weight = 50 },
  { url = "http://127.0.0.1:18082", weight = 30 },
  { url = "http://127.0.0.1:18083", weight = 20 },
]
connect_timeout_ms = 5000
pool_max_idle_per_host = 512

[upstreams.health_check]
kind = "http"
path = "/health"
interval_ms = 5000
timeout_ms = 1000
unhealthy_threshold = 2
healthy_threshold = 1

[[routes]]
id = "svc_000"
path_prefix = "/svc/000"
upstream = "lb_pool"
max_attempts = 1
allow_websockets = false

