static_resources:
  listeners:
    - name: bench_jwt_zstd_listener
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 18081
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: bench_jwt_zstd
                generate_request_id: true
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: bench
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: bench_upstream }
                http_filters:
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        bench_hs256:
                          issuer: "https://bench.shunt.dev"
                          audiences: ["shunt-api"]
                          local_jwks:
                            inline_string: '{"keys": [{"kty": "oct", "alg": "HS256", "kid": "bench-hs1", "k": "c2h1bnQtYmVuY2gtaHMyNTYtc2VjcmV0LWtleS0zMmIh"}]}'
                      rules:
                        - match: { prefix: "/" }
                          requires:
                            provider_name: bench_hs256
                  - name: envoy.filters.http.compressor
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.compressor.v3.Compressor
                      response_direction_config:
                        common_config:
                          min_content_length: 512
                          content_type:
                            - "application/json"
                            - "text/plain"
                      compressor_library:
                        name: zstd_compressor
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.compression.zstd.compressor.v3.Zstd
                          compression_level: 3
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: bench_upstream
      connect_timeout: 5s
      type: STATIC
      lb_policy: ROUND_ROBIN
      circuit_breakers:
        thresholds:
          - max_connections: 4096
            max_pending_requests: 4096
            max_requests: 4096
      load_assignment:
        cluster_name: bench_upstream
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 18080
