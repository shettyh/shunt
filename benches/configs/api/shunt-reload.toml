# Soak Workload: 3-plugin chain with Admin API enabled for live POST /reload under load
[server]
listen = "127.0.0.1:18081"
drain_timeout_ms = 5000

[admin]
enabled = true
listen = "127.0.0.1:19090"

[[upstreams]]
name = "bench_upstream"
endpoints = ["http://127.0.0.1:18080"]
connect_timeout_ms = 5000
pool_max_idle_per_host = 512

[[routes]]
id = "reload_under_load"
path_prefix = "/"
upstream = "bench_upstream"
max_attempts = 1
allow_websockets = false

[[routes.plugins]]
name = "request-id"

[[routes.plugins]]
name = "bearer-auth"
[routes.plugins.config]
tokens = [{ token = "bench-secret-token", subject = "bench-client" }]

[[routes.plugins]]
name = "rate-limit"
id = "bench-rl-reload"
[routes.plugins.config]
requests_per_second = 1000000.0
burst = 1000000
key = "client_ip"
