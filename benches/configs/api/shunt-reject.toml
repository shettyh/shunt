# API Workload: Rate-limit load-shedding fast-path (429 short-circuit without touching upstream)
[server]
listen = "127.0.0.1:18081"
drain_timeout_ms = 5000

[admin]
enabled = false

[[upstreams]]
name = "bench_upstream"
endpoints = ["http://127.0.0.1:18080"]
connect_timeout_ms = 5000
pool_max_idle_per_host = 64

[[routes]]
id = "reject_429"
path_prefix = "/"
upstream = "bench_upstream"
max_attempts = 1
allow_websockets = false

[[routes.plugins]]
name = "request-id"

[[routes.plugins]]
name = "rate-limit"
id = "strict-rl"
[routes.plugins.config]
requests_per_second = 0.0001
burst = 1
key = "client_ip"
