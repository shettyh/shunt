# AI Benchmark: Guardrailed AI Chain (RFC 0015)
# request-id + ai-model-router + ai-guardrails (PII + secrets + prompt_injection + regex + keywords, both directions)
# + ai-provider-adapter + ai-usage-tracker
[server]
listen = "127.0.0.1:18081"
drain_timeout_ms = 10000

[admin]
enabled = false

[[upstreams]]
name = "mock_ai"
endpoints = ["http://127.0.0.1:18080"]
connect_timeout_ms = 5000
pool_max_idle_per_host = 2048

[[routes]]
id = "ai_guardrails_bench"
path_prefix = "/v1"
upstream = "mock_ai"
max_body_bytes = 2097152
max_attempts = 1
response_headers_timeout_ms = 30000
idle_chunk_timeout_ms = 30000
allow_websockets = false

[[routes.plugins]]
name = "request-id"

[[routes.plugins]]
name = "ai-model-router"
[routes.plugins.config.models]
gpt-bench = [{ provider = "openai", upstream = "mock_ai", model = "gpt-bench" }]
claude-bench = [{ provider = "anthropic", upstream = "mock_ai", model = "claude-bench" }]

[[routes.plugins]]
name = "ai-guardrails"
[routes.plugins.config]
presets = ["pii", "secrets", "prompt_injection"]
direction = "both"
action = "redact"
redaction_mode = "mask"
on_stream_violation = "redact_and_stop"
stream_holdback_chars = 64

[[routes.plugins.config.regex_rules]]
name = "internal_ticket"
pattern = "ACME-[0-9]{4,8}"
direction = "both"
action = "redact"
replacement = "[REDACTED:TICKET]"

[[routes.plugins.config.keyword_rules]]
name = "confidential_codenames"
keywords = ["project_obsidian", "internal_merger"]
direction = "request"
action = "block"

[[routes.plugins]]
name = "ai-provider-adapter"
[routes.plugins.config.providers.openai]
dialect = "openai_compatible"
auth = { type = "bearer", api_key = "sk-openai-bench" }

[routes.plugins.config.providers.anthropic]
dialect = "anthropic"
auth = { type = "header", header = "x-api-key", api_key = "sk-ant-bench" }

[[routes.plugins]]
name = "ai-usage-tracker"
[routes.plugins.config]
log_usage = false
