# LiteLLM Proxy config with master_key auth + in-memory router RPM/TPM limits (no DB)
model_list:
  - model_name: gpt-bench
    litellm_params:
      model: openai/gpt-bench
      api_base: http://127.0.0.1:18080/v1
      api_key: sk-openai-bench
      rpm: 10000000
      tpm: 1000000000
  - model_name: claude-bench
    litellm_params:
      model: anthropic/claude-bench
      api_base: http://127.0.0.1:18080
      api_key: sk-ant-bench
      rpm: 10000000
      tpm: 1000000000

litellm_settings:
  drop_params: true
  set_verbose: false
  turn_off_message_logging: true
  telemetry: false

general_settings:
  master_key: sk-bench-virtual-key
  dangerously_permit_weak_or_unset_master_key: true
  disable_spend_logs: true
  disable_error_logs: true
