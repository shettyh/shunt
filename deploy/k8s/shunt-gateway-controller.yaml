# Shunt Kubernetes Gateway API v1 Controller Deployment (RFC 0028)
# Shared non-root Shunt Deployment + minimal RBAC + GatewayClass (`shunt`).
#
# Usage:
#   kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.1/standard-install.yaml
#   kubectl apply -f deploy/k8s/shunt-gateway-controller.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: shunt-system
  labels:
    app.kubernetes.io/name: shunt
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shunt
  namespace: shunt-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shunt-gateway-controller
rules:
  - apiGroups: [""]
    resources: ["namespaces", "endpoints", "secrets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses", "gateways", "httproutes", "referencegrants"]
    verbs: ["get", "list"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses/status", "gateways/status", "httproutes/status"]
    verbs: ["patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shunt-gateway-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: shunt-gateway-controller
subjects:
  - kind: ServiceAccount
    name: shunt
    namespace: shunt-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shunt
  namespace: shunt-system
  labels:
    app.kubernetes.io/name: shunt
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shunt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shunt
    spec:
      serviceAccountName: shunt
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shunt
          image: ghcr.io/shettyh/shunt:latest
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --k8s-controller
            - --k8s-controller-name=shunt.io/gateway-controller
            - --k8s-service-type=ClusterIP
            - --k8s-pod-selector=app.kubernetes.io/name=shunt
            - --k8s-port-range=10080-19999
            - --k8s-poll-interval-ms=500
          env:
            - name: RUST_LOG
              value: info
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 256Mi
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: shunt
spec:
  controllerName: shunt.io/gateway-controller
