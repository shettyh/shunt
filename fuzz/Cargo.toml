[package]
name = "shunt-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
http = "1"
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
shunt-ai = { path = "../crates/shunt-ai" }
shunt-mcp = { path = "../crates/shunt-mcp" }
shunt-config = { path = "../crates/shunt-config" }
shunt-engine = { path = "../crates/shunt-engine" }
shunt-plugin-sdk = { path = "../crates/shunt-plugin-sdk" }
shunt-plugins = { path = "../crates/shunt-plugins" }

[[bin]]
name = "fuzz_sse_parser"
path = "fuzz_targets/fuzz_sse_parser.rs"
